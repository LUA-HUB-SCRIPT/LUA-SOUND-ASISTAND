```yaml
name: Build LUA SOUND Assistant EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          if (!(Test-Path "main.py")) {
            Write-Error "main.py tidak ditemukan di root repository"
            exit 1
          }

          pyinstaller --noconfirm --clean --onefile --windowed --name LUA-SOUND-ASISTAND main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: LUA-SOUND-ASISTAND-EXE
          path: dist/LUA-SOUND-ASISTAND.exe
          if-no-files-found: error
          retention-days: 14
```
