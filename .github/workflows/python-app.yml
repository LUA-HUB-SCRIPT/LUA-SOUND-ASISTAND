```yaml
name: Build LUA SOUND Assistant EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Check Main File
        shell: pwsh
        run: |
          if (!(Test-Path "main.py")) {
            Write-Error "main.py tidak ditemukan di root repository!"
            exit 1
          }

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "LUA-SOUND-ASISTAND" `
            main.py

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "dist/LUA-SOUND-ASISTAND.exe"

          if (!(Test-Path $exe)) {
            Write-Error "EXE tidak berhasil dibuat!"
            exit 1
          }

          $file = Get-Item $exe

          if ($file.Length -le 0) {
            Write-Error "File EXE kosong!"
            exit 1
          }

          Write-Host "Build berhasil: $($file.FullName)"
          Write-Host "Ukuran: $($file.Length) bytes"

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LUA-SOUND-ASISTAND-EXE
          path: dist/LUA-SOUND-ASISTAND.exe
          if-no-files-found: error
          retention-days: 14
