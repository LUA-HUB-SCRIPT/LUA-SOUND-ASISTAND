name: Build LUA SOUND Assistant EXE

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }

      - name: Check Main File
        shell: pwsh
        run: |
          if (!(Test-Path "main.py")) {
            throw "main.py tidak ditemukan di root repository"
          }

          python -m py_compile main.py

          if ($LASTEXITCODE -ne 0) {
            throw "main.py memiliki kesalahan sintaks"
          }

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "LUA-SOUND-ASISTAND" `
            main.py

          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller gagal membuat EXE"
          }

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "dist/LUA-SOUND-ASISTAND.exe"

          if (!(Test-Path $exe)) {
            throw "File EXE tidak ditemukan"
          }

          if ((Get-Item $exe).Length -le 0) {
            throw "File EXE kosong"
          }

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LUA-SOUND-ASISTAND-EXE
          path: dist/LUA-SOUND-ASISTAND.exe
          if-no-files-found: error
          retention-days: 14

