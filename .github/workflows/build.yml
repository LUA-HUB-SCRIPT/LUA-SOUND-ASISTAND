```yaml
name: Build AHZA Assistant EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }
          pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          if (!(Test-Path main.py)) {
            Write-Error "File main.py tidak ditemukan di root repository."
            exit 1
          }
          pyinstaller --noconfirm --clean --onefile --windowed --name AHZA-Assistant main.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AHZA-ASISTANT-WINDOWS-EXE
          path: dist/AHZA-Assistant.exe
          if-no-files-found: error
          retention-days: 14
```
